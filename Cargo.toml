[package]
name = "uninet"
version = "0.2.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.2", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "multipart", "gzip", "brotli", "deflate", "stream"] }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1"
indicatif = "0.18.6"
anyhow = "1"
futures-util = "0.3"
url = "2"
percent-encoding = "2"
anstream = "1.0"
anstyle = "1.0"
base64 = "0.22"
bytes = "1"
suppaftp = { version = "12", default-features = false, features = ["tokio", "tokio-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"
sys-locale = "0.3"
russh = "0.64"
russh-sftp = "3"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
digest = "0.10"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
